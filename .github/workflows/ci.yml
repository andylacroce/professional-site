name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A newer push to the same PR supersedes an in-flight run; main runs are
# never cancelled so every merge keeps a complete result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        shell: bash
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium firefox webkit

      # WebKit needs system libs (e.g. libevent) that ubuntu-latest lacks, and
      # they live outside the browser cache, so install them on every run.
      - name: Install WebKit system dependencies
        run: npx playwright install-deps webkit

      # Runs lint -> typecheck -> unit tests (90% coverage gate) -> build ->
      # E2E tests in order, stopping at the first failure, and always prints
      # a compact pass/fail summary at the end (scripts/run-ci.mjs) —
      # exactly mirrors `npm run ci` locally.
      - name: Run CI pipeline
        run: npm run ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
